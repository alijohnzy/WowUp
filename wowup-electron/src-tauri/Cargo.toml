[package]
name = "wowup"
version = "2.23.0"
description = "World of Warcraft addon updater"
authors = ["WowUp LLC <zakrn@wowup.io>"]
edition = "2021"
rust-version = "1.77.2"

# The library is what Tauri actually runs; main.rs is a thin shim so the same code
# can be built for mobile later. Named `wowup_lib` to avoid colliding with the binary.
[lib]
name = "wowup_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
# WowClientType must cross IPC as a bare number to match the TypeScript enum.
serde_repr = "0.1"
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["fs"] }
# glob matching for list-files / list-entries, which the JS did with globrex.
globset = "0.4"
# The WowUp scanner fingerprints files with md5, matching file.utils.ts hashFile.
md5 = "0.7"

# Plugin set. Deliberately minimal — each phase adds its own.
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# resolveProducts on mac reads .app bundles; no extra crates needed yet.

# `macros` and `rt-multi-thread` are for #[tokio::test] only. Keep this block last: a
# [dev-dependencies] header in the middle of [dependencies] silently reassigns everything
# after it, which turned the plugins into dev-only and failed the build with
# "Permission os:default not found".
[dev-dependencies]
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }

[features]
# Off by default; `tauri dev` enables it so devtools are available.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
