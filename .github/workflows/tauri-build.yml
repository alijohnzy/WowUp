# Builds the Tauri app and, optionally, publishes it to the Releases tab.
#
# The Tauri counterpart to svelte-branch-build.yml. Same renderer, different shell:
#
#   Windows  NSIS installer + portable zip  (unsigned)
#   Linux    AppImage + deb                 (unsigned)
#   macOS    dmg, Apple Silicon             (ad-hoc signed, not notarized)
#
# The portable zip is the raw executable plus the `assets/` directory Tauri stages beside it,
# which is what `resource_dir()` resolves to on Windows — so the WowUp companion addon
# templates and the logos are found the same way they are in an installed copy. Unzip and run;
# nothing is written outside the app's own data directory.
#
# One difference from the installer: the NSIS bundle ships the WebView2 bootstrapper, the zip
# does not. Windows 10 and 11 include WebView2, so this only matters on an older or stripped
# install, where the portable build will fail to open a window.
#
# Unsigned means Windows SmartScreen will warn on first run — "Windows protected your PC",
# More info → Run anyway. Signing needs a certificate; wire one in if these ever go to people
# who did not build them.
#
# macOS gets an ad-hoc signature (bundle.macOS.signingIdentity "-" in
# src-tauri/tauri.macos.conf.json): Apple Silicon will not run an unsigned app at all, and
# without one a downloaded copy is reported as "damaged". It is not notarized — that needs a
# paid Apple Developer account — so the first open is refused until the user allows it in
# System Settings → Privacy & Security → Open Anyway. Apple Silicon only: Intel Macs would need
# a second build (or a universal one, twice the compile).
#
# SECRET SETUP
#   Settings → Secrets and variables → Actions → Repository secrets → New repository secret
#     Name:   CURSEFORGE_API_KEY
#     Value:  the key, unquoted
#
#   A *repository* secret, not an *environment* secret — see svelte-branch-build.yml for why.
#
# ── READ THIS BEFORE TICKING "Publish to the Releases tab" ────────────────────────────────
#
#   The build bakes CURSEFORGE_API_KEY into the renderer bundle. That is what makes the app
#   work, and it is true of any distributed WowUp build.
#
#   A release is not the same exposure as a run artifact. This repository is PUBLIC, so:
#     - artifacts expire (7 days here) and need the run URL; a release is permanent, listed on
#       the repo's front page, and indexed
#     - anyone who downloads the installer can extract the key from the bundle
#
#   So the key in any published release should be one you are willing to rotate, and rotating
#   it is the remedy if it is ever abused. If that is not acceptable, leave the release box
#   unticked: the build still runs and still attaches the installers to the run, which is
#   enough for testing.
#
#   Making the repository private removes the exposure but also the point of a releases tab.
# ──────────────────────────────────────────────────────────────────────────────────────────

name: Build Tauri App

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which platforms to build'
        type: choice
        default: 'windows'
        options: ['windows', 'linux', 'macos', 'all']
      publish_release:
        description: 'Publish to the Releases tab. The installers embed the CurseForge key and a release is public and permanent — read the header first.'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the release as a pre-release (for a build only some people should try). Otherwise it becomes the Latest release.'
        type: boolean
        default: false
      tag:
        description: 'Release tag. Blank generates one from the version and run number, which cannot collide with an existing tag.'
        type: string
        default: ''

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    # A Tauri build compiles the Rust crate from scratch on a cold cache, which is slower than
    # the Electron equivalent. Still far short of the six-hour default.
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to match the upstream release workflow.
          - os: windows-2022
            label: Windows (NSIS + portable)
            key: windows
            artifacts: |
              wowup-electron/src-tauri/target/release/bundle/nsis/*.exe
              wowup-electron/src-tauri/target/release/bundle/nsis/*.sig
              wowup-electron/portable/*.zip
          - os: ubuntu-22.04
            label: Linux (AppImage + deb)
            key: linux
            artifacts: |
              wowup-electron/src-tauri/target/release/bundle/appimage/*.AppImage
              wowup-electron/src-tauri/target/release/bundle/appimage/*.sig
              wowup-electron/src-tauri/target/release/bundle/deb/*.deb
              wowup-electron/src-tauri/target/release/bundle/deb/*.sig
          # Apple Silicon. The .app.tar.gz is what the updater downloads; the dmg is for people.
          - os: macos-15
            label: macOS (Apple Silicon dmg)
            key: macos
            artifacts: |
              wowup-electron/src-tauri/target/release/bundle/dmg/*.dmg
              wowup-electron/src-tauri/target/release/bundle/macos/*.app.tar.gz
              wowup-electron/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

    steps:
      - name: Skip platforms not requested
        id: gate
        run: |
          if [ "${{ inputs.platforms }}" = "all" ] || [ "${{ inputs.platforms }}" = "${{ matrix.key }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not requested — skipping ${{ matrix.label }}."
          fi

          # Artifact names may not contain a slash, and branch names may (migrate/tauri did).
          echo "ref=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      # Fails immediately rather than after a Rust compile, and says how to fix it.
      - name: Check the secret is readable
        if: steps.gate.outputs.run == 'true'
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -z "${CURSEFORGE_API_KEY}" ]; then
            echo "::error::CURSEFORGE_API_KEY is empty."
            echo "Set it as a REPOSITORY secret: Settings → Secrets and variables → Actions →"
            echo "Repository secrets → New repository secret."
            exit 1
          fi
          echo "Secret is present (${#CURSEFORGE_API_KEY} characters)."

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5

      - name: Use Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Rust toolchain
        if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      # Without this every run recompiles the whole dependency tree, which is most of the
      # build time. Keyed on the crate directory so the platforms do not share a cache.
      - name: Cache Rust build
        if: steps.gate.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wowup-electron/src-tauri

      # webkit2gtk is the webview Tauri renders in on Linux; librsvg is needed to build the
      # tray and window icons.
      #
      # patchelf is not optional here: bundle.linux.appimage.bundleMediaFramework is on, and
      # without patchelf linuxdeploy fails with "failed to run linuxdeploy" — the real cause,
      # "Error: patchelf not found", only appears under --verbose.
      #
      # The gstreamer plugins are what bundleMediaFramework collects. They are what lets the
      # ad frame play a video ad instead of taking the webview down with it.
      - name: Linux build dependencies
        if: steps.gate.outputs.run == 'true' && matrix.key == 'linux'
        run: |
          sudo apt-get update
          # The ubuntu-22.04 image ships libunwind-14-dev, which conflicts with the libunwind-dev
          # that libgstreamer1.0-dev depends on — apt gives up with "held broken packages".
          if dpkg -s libunwind-14-dev >/dev/null 2>&1; then
            sudo apt-get remove -y libunwind-14-dev
          fi
          # desktop-file-utils: appimagetool, in the thin AppImage repack below, refuses to run
          # without desktop-file-validate.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            desktop-file-utils

      # wowup-electron depends on the local wowup-lib-core package, so the library is compiled
      # before the app installs.
      - name: Build wowup-lib
        if: steps.gate.outputs.run == 'true'
        run: |
          cd ./wowup-lib
          npm ci
          npm run build

      - name: Install app dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          cd ./wowup-electron
          npm ci

      - name: Install renderer dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          cd ./wowup-electron/renderer-svelte
          npm ci

      # The renderer and the Rust crate are platform-independent, so checking them once is
      # enough. Linux is chosen because it is the cheaper runner.
      - name: Typecheck
        if: steps.gate.outputs.run == 'true' && matrix.key == 'linux'
        run: |
          cd ./wowup-electron/renderer-svelte
          npm run check

      - name: Renderer tests
        if: steps.gate.outputs.run == 'true' && matrix.key == 'linux'
        run: |
          cd ./wowup-electron/renderer-svelte
          npx vitest run

      - name: Rust tests
        if: steps.gate.outputs.run == 'true' && matrix.key == 'linux'
        run: |
          # tauri::generate_context!() fails to compile when frontendDist does not exist, and
          # the renderer is only built later, by tauri:build. The tests embed nothing from it,
          # so an empty directory is enough.
          mkdir -p ./wowup-electron/renderer-svelte/build
          cd ./wowup-electron/src-tauri
          cargo test

      # The updater (src-tauri/src/updater.rs) orders builds by version, and every build of
      # 2.25.4 used to report 2.25.4. The run number goes in as semver build metadata,
      # 2.25.4+18, which semver orders numerically and the NSIS bundler turns into the Windows
      # file version 2.25.4.18. Only the checkout is changed; local builds stay at 2.25.4, and
      # updater.rs does not offer updates to those.
      - name: Stamp the build number into the version
        if: steps.gate.outputs.run == 'true'
        run: |
          cd ./wowup-electron
          node -e '
            const fs = require("fs");
            const f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.version = `${c.version.split("+")[0]}+${process.env.GITHUB_RUN_NUMBER}`;
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
            console.log(`Building version ${c.version}`);

            // Notes for the upcoming build sit under "#next" in the changelog: its number is
            // only known here, and a cancelled run uses one up. (No apostrophes in this
            // script: it is one single-quoted shell argument.)
            const log = "renderer-svelte/src/lib/data/changelogs.json";
            const text = fs.readFileSync(log, "utf8");
            const stamped = text.replace(/ #next"/g, ` #${process.env.GITHUB_RUN_NUMBER}"`);
            if (stamped !== text) {
              fs.writeFileSync(log, stamped);
              console.log(`Changelog entry stamped #${process.env.GITHUB_RUN_NUMBER}`);
            }
          '

      # tauri:build runs the renderer build itself, through beforeBuildCommand, in the tauri
      # flavour — CurseForge for addons plus the Wago ad frame.
      - name: Build app
        id: build
        if: steps.gate.outputs.run == 'true'
        env:
          # Read by renderer-svelte/vite.config.ts. Passed as an env var rather than sourced
          # from a file: a key of the form "$2a$10$…" loses its $-segments to shell expansion
          # if it is ever `source`d, producing a silently invalid key and a 403 on every call.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          cd ./wowup-electron

          # Retried because the bundling step downloads its own tooling — NSIS and
          # nsis_tauri_utils.dll on Windows, linuxdeploy on Linux — from GitHub releases, and
          # that transfer is not always completed: the first run of this workflow compiled the
          # crate in six minutes and then died on `io: Peer disconnected` fetching a DLL.
          #
          # Cheap to retry: the Rust artifacts are already built, so a second attempt goes
          # almost straight back to bundling.
          for attempt in 1 2 3; do
            if npm run tauri:build; then
              built=1
              break
            fi
            echo "::warning::tauri build failed on attempt ${attempt}"
            [ "$attempt" = 3 ] || sleep 20
          done

          if [ "${built:-0}" != 1 ]; then
            echo "::error::tauri build failed three times."
            exit 1
          fi

      # Tauri has no portable target, but it does not need one: the executable plus the
      # `assets/` directory the build stages next to it is a working copy, because
      # `resource_dir()` on Windows is the executable's own directory.
      #
      # Assembled from target/release rather than from the repo, so the contents follow
      # bundle.resources automatically instead of drifting from it.
      - name: Assemble the portable zip
        if: steps.gate.outputs.run == 'true' && matrix.key == 'windows' && steps.build.outcome == 'success'
        run: |
          cd ./wowup-electron
          name=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          release=src-tauri/target/release

          # The binary is named after the *Cargo package* (wowup.exe), not productName — the
          # build says so: "Built application at: ...\target\release\wowup.exe". Found by glob
          # rather than by either name, so renaming the crate or the product cannot silently
          # break this. Only the app's own executable sits at the top of target/release;
          # build scripts and dependencies are in subdirectories.
          shopt -s nullglob
          exes=("$release"/*.exe)
          if [ ${#exes[@]} -ne 1 ]; then
            echo "::error::Expected exactly one executable in $release, found ${#exes[@]}: ${exes[*]}"
            exit 1
          fi

          stage="portable/${name}-${version}-portable"
          mkdir -p "$stage"
          # Renamed to the product name, so the portable copy looks like an installed one.
          cp "${exes[0]}" "$stage/${name}.exe"
          # Absent only if bundle.resources is emptied; the app would then fail to write the
          # companion addon at runtime, which is worth failing the build over.
          if [ -d "$release/assets" ]; then
            cp -r "$release/assets" "$stage/"
          else
            echo "::error::No $release/assets — resources were not staged, so the portable build would be broken."
            exit 1
          fi

          cd portable
          7z a -tzip "${name}-${version}-portable.zip" "${name}-${version}-portable" >/dev/null
          rm -rf "${name}-${version}-portable"
          ls -l

      # The AppImage is built on Ubuntu 22.04, and linuxdeploy bundles that release's Wayland
      # client libraries and libepoxy. A newer host Mesa then loads against those and cannot
      # create an EGL display — "Could not create default EGL display: EGL_BAD_PARAMETER.
      # Aborting..." — so on current distributions (Arch, KDE, AMD here) the app died at
      # startup and every published AppImage showed only a gray window. Measured on the
      # published build 18: as released it aborted; with these five libraries removed and the
      # AppImage repacked it started normally. Every desktop that can run the app has its own
      # copies (GTK depends on them), so they come out. Before signing, so the updater's
      # signature covers the final file.
      # Tauri's AppImage carries WebKitGTK, GTK, ICU and GStreamer: 154 MB for a 27 MB app.
      # This keeps WowUpNight only and runs it on the system's WebKitGTK, as the .deb does —
      # see scripts/thin-appimage.sh. Before signing, so the signature covers the thin file.
      - name: Make the AppImage use the system WebKitGTK
        if: steps.gate.outputs.run == 'true' && matrix.key == 'linux' && steps.build.outcome == 'success'
        run: |
          cd ./wowup-electron/src-tauri/target/release/bundle/appimage
          shopt -s nullglob
          images=(*.AppImage)
          if [ ${#images[@]} -ne 1 ]; then
            echo "::error::Expected one AppImage, found ${#images[@]}: ${images[*]}"
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          bash "$GITHUB_WORKSPACE/wowup-electron/scripts/thin-appimage.sh" "$PWD/${images[0]}" "$RUNNER_TEMP/appimagetool"
          ls -l "${images[0]}"

      # What the updater installs on a Mac: the .app, tarred with it at the top, as Tauri's own
      # createUpdaterArtifacts would make it (off for the reason given below). Named like the
      # other platforms' files, version and arch included — the feed tells architectures apart
      # by the name.
      - name: Pack the macOS app for the updater
        if: steps.gate.outputs.run == 'true' && matrix.key == 'macos' && steps.build.outcome == 'success'
        run: |
          cd ./wowup-electron
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cd src-tauri/target/release/bundle/macos
          app=$(ls -d *.app | head -n 1)
          [ -n "$app" ] || { echo "::error::No .app was bundled."; exit 1; }
          # The bundle must carry a valid signature, or Apple Silicon refuses to start it.
          codesign --verify --deep --strict --verbose=2 "$app"
          tar -czf "${app%.app}_${version}_aarch64.app.tar.gz" "$app"
          ls -la *.app.tar.gz

      # The updater installs nothing whose minisign signature does not match the public key in
      # tauri.conf.json. Signed here rather than with bundle.createUpdaterArtifacts, which
      # would make every local `npm run tauri:build` fail without the private key, and which
      # does not sign the .deb.
      - name: Sign the installers for the updater
        if: steps.gate.outputs.run == 'true' && steps.build.outcome == 'success'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so these installers cannot be offered as updates."
            exit 0
          fi
          cd ./wowup-electron
          bundle=src-tauri/target/release/bundle
          shopt -s nullglob
          for f in "$bundle"/nsis/*-setup.exe "$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb \
                   "$bundle"/macos/*.app.tar.gz; do
            # Prints the signature it also writes to "$f.sig"; the file is what is used.
            npx tauri signer sign "$f" > /dev/null
            echo "signed $(basename "$f")"
          done

      # The renderer bundle is the same one the verifier reads for the Electron build, so this
      # catches a key that arrived mangled rather than missing.
      - name: Verify the key was baked into the bundle
        if: steps.gate.outputs.run == 'true'
        run: |
          cd ./wowup-electron
          npm run svelte:verify:key

      - name: Summarise
        if: steps.gate.outputs.run == 'true' && !cancelled()
        run: |
          # No cd: this runs after a failed build too, and stepping into a directory the build
          # never created turned one failure into a second, more confusing one. Globs that
          # match nothing simply fall through the -f test.
          bundle=wowup-electron/src-tauri/target/release/bundle
          {
            echo "### ${{ matrix.label }}"
            echo
            echo "\`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::8}\`"
            echo
            found=0
            echo '| file | size |'
            echo '|---|---:|'
            for f in "$bundle"/nsis/*.exe "$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb \
                     "$bundle"/dmg/*.dmg "$bundle"/macos/*.app.tar.gz wowup-electron/portable/*.zip; do
              [ -f "$f" ] || continue
              found=1
              echo "| \`$(basename "$f")\` | $(( $(stat -c%s "$f" 2>/dev/null || stat -f%z "$f") / 1048576 )) MB |"
            done
            [ "$found" = "1" ] || echo '| _none produced_ | |'
          } >> "$GITHUB_STEP_SUMMARY"

      # compression-level 0: an NSIS installer and an AppImage are already compressed
      # containers, so re-deflating them costs runner minutes and gains almost nothing.
      #
      # Keyed off the build step rather than overall job success, so a failing verification
      # still hands over the installer it already produced.
      - name: Upload installers
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: WowUpNight-${{ matrix.key }}-${{ steps.gate.outputs.ref }}
          path: ${{ matrix.artifacts }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Only when every requested platform built. With !cancelled() a failed Linux job still
    # published its pre-repack AppImage, unsigned, as build 21 — the feed guard kept it out
    # of updates, but the release page offered a file that crashed on current distributions.
    # Platforms that were not requested skip their steps and still count as success.
    if: ${{ inputs.publish_release && success() }}
    runs-on: ubuntu-latest

    # The default token is read-only on this repository; creating a release needs write.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # For scripts/tauri-updater-manifest.mts and release-notes.mts, TypeScript run directly.
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      # merge-multiple flattens both platforms into one directory, so the release gets the
      # installers rather than a folder per platform.
      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: WowUpNight-*
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Searched recursively: upload-artifact keeps each file's path below the common
          # ancestor (portable/…zip, src-tauri/target/release/bundle/nsis/…exe), so a glob over
          # the top of dist/ found nothing and the first real publish failed with this error.
          # The stamped version (2.25.4+18) is in every file name. '+' means a space in a URL
          # query and is easy to mangle, so the released names use '.' instead; the manifest is
          # written from these final names, and the signatures cover content, not names.
          find dist -type f -name '*+*' -print0 | while IFS= read -r -d '' f; do
            mv "$f" "$(dirname "$f")/$(basename "$f" | tr '+' '.')"
          done

          mapfile -t files < <(find dist -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers were produced, so there is nothing to release."
            exit 1
          fi

          version=$(node -p "require('./wowup-electron/src-tauri/tauri.conf.json').version")
          tag="${{ inputs.tag }}"
          # The run number keeps a generated tag unique, so re-running never collides with a
          # tag that already exists and never silently replaces a published release.
          [ -n "$tag" ] || tag="tauri-v${version}-${GITHUB_RUN_NUMBER}"

          # What the build changed, from its in-app changelog entry (still "#next" in this
          # checkout), above the downloads. Left out when the build has no entry.
          whatsnew=$(node wowup-electron/scripts/release-notes.mts --build "${GITHUB_RUN_NUMBER}" --next)

          download=$(printf '%s\n' \
            "## Download" \
            "" \
            "WowUpNight build from \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::8}\`." \
            "" \
            "| platform | file |" \
            "|---|---|" \
            "$(for f in "${files[@]}"; do
                 case "$f" in
                   *portable*.zip) echo "| Windows (portable) | \`$(basename "$f")\` |";;
                   *.exe)      echo "| Windows (installer) | \`$(basename "$f")\` |";;
                   *.AppImage) echo "| Linux | \`$(basename "$f")\` |";;
                   *.deb)      echo "| Linux (deb) | \`$(basename "$f")\` |";;
                   *.dmg)      echo "| macOS (Apple Silicon) | \`$(basename "$f")\` |";;
                 esac
               done)" \
            "" \
            "Unsigned, so Windows SmartScreen will warn on first run: **More info → Run anyway**." \
            "" \
            "The portable zip needs WebView2 on the machine; Windows 10 and 11 ship it. The installer bundles it." \
            "" \
            "macOS: Apple Silicon only, and not notarized. Open the dmg and drag WowUpNight to Applications. The first time it opens, macOS refuses it; go to **System Settings → Privacy & Security** and click **Open Anyway**. The \`.app.tar.gz\` is for the in-app updater." \
            "" \
            "The Linux AppImage and .deb use the WebKitGTK 4.1 already on the system rather than bundling a browser engine. If it is missing: \`sudo pacman -S webkit2gtk-4.1\` (Arch, Manjaro), \`sudo apt install libwebkit2gtk-4.1-0\` (Debian, Ubuntu), \`sudo dnf install webkit2gtk4.1\` (Fedora)." \
            "" \
            "Built by [run ${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).")
          notes="$download"
          [ -z "$whatsnew" ] || notes="${whatsnew}"$'\n\n'"${download}"

          flags=(--title "WowUpNight ${version} (build ${GITHUB_RUN_NUMBER})" --notes "$notes" --target "${GITHUB_SHA}")
          # A full release is marked Latest explicitly: GitHub's own choice goes by tag order,
          # and the feed release below must never be the one it picks.
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists — replacing its files rather than creating it again."
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" "${flags[@]}"
          fi

          {
            echo "### Released"
            echo
            echo "**$tag** — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$tag"
          } >> "$GITHUB_STEP_SUMMARY"

          # The updater feed: latest.json on one fixed release, replaced on every publish, so
          # installed copies have a stable URL (tauri.conf.json plugins.updater.endpoints).
          # GitHub's /releases/latest skips pre-releases, and listing them needs the rate-
          # limited API. Every published build goes in: there are no release channels.
          #
          # Only a release with every platform moves the feed. The manifest has one version,
          # so a Windows-only build would leave Linux copies with no entry, and the updater
          # treats a missing entry as an error on every check.
          if [ "${{ inputs.platforms }}" != "all" ]; then
            echo "::warning::Built for '${{ inputs.platforms }}' only, so the updater feed was left on the previous build."
            exit 0
          fi
          if ! find dist -name '*.sig' | grep -q .; then
            echo "::warning::No signatures (TAURI_SIGNING_PRIVATE_KEY unset), so the updater feed was not changed."
            exit 0
          fi

          node wowup-electron/scripts/tauri-updater-manifest.mts \
            --dir dist --repo "${GITHUB_REPOSITORY}" --tag "$tag" \
            --version "${version}+${GITHUB_RUN_NUMBER}" --out latest.json \
            --require linux-x86_64-appimage,linux-x86_64-deb,windows-x86_64-nsis,darwin-aarch64-app

          # The same manifest on this build's own release, so a later build can install this
          # one again: Options → "Install an earlier version" points the updater at it.
          cp latest.json updater.json
          gh release upload "$tag" updater.json --clobber

          feed=tauri-updater
          if ! gh release view "$feed" >/dev/null 2>&1; then
            gh release create "$feed" --prerelease --target "${GITHUB_SHA}" \
              --title "Updater feed (do not delete)" \
              --notes "latest.json here is what installed Tauri builds check for updates. Rewritten by every published build of .github/workflows/tauri-build.yml; deleting this release stops updates."
          fi
          gh release upload "$feed" latest.json --clobber
          echo "Updater feed now offers ${version}+${GITHUB_RUN_NUMBER} (${tag})." >> "$GITHUB_STEP_SUMMARY"
