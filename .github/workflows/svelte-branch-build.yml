# Builds the Svelte renderer for Linux, Windows and macOS. Manual only, on whichever branch you
# select.
#
# Mirrors electron-ow-all-build.yml's platform matrix, minus everything to do with signing,
# notarisation and publishing — these are test builds, not releases:
#
#   Linux    AppImage
#   Windows  NSIS installer + portable exe   (unsigned)
#   macOS    dmg + zip, x64 and arm64        (unsigned, not notarised)
#
# Unsigned means Windows SmartScreen will warn, and macOS will refuse to open the app until you
# clear the quarantine attribute:
#   xattr -dr com.apple.quarantine /Applications/WowUp-CF-Svelte.app
# Signing needs the certificate secrets the upstream release workflow uses; wire those in if you
# ever want distributable builds.
#
# SECRET SETUP
#   Settings → Secrets and variables → Actions → Repository secrets → New repository secret
#     Name:   CURSEFORGE_API_KEY
#     Value:  the key, unquoted
#
#   A *repository* secret, not an *environment* secret. Environment secrets are only readable by
#   a job that declares `environment: <name>`; without that, ${{ secrets.X }} is an empty string
#   and the build happily ships a dead key. To keep an environment instead, add
#   `environment: <name>` under `runs-on` below.
#
#   The key is passed as an env var, so it is masked in logs and never written to the repo. It is
#   deliberately not echoed — inject-token.js prints it on the Angular path, which Actions masks
#   but is not worth relying on.
#
# ARTIFACTS
#   The finished apps are attached to the run and downloadable from its Summary page, under
#   "Artifacts", as WowUp-CF-Svelte-<platform>-<branch>.zip. Kept for 7 days.
#
#   Read this before running it on a public repository. The build bakes CURSEFORGE_API_KEY into
#   the renderer bundle — that is what makes the app work — and artifacts on a public repo can be
#   downloaded by ANYONE with the run URL, no account needed. Anyone who does can extract the key
#   from the bundle. This is the same exposure any distributed WowUp build has, except the key
#   would be yours rather than the project's.
#
#   Three ways to handle it, in the order I would consider them:
#     - Leave it, and rotate the key at CurseForge if it is ever abused. Lowest friction.
#     - Untick "Attach the built apps" for runs you only want to see pass. The checks, the boot
#       verification and the key verification all still run; only the download goes away.
#     - Make the repository private, which limits downloads to people with repo access. Note the
#       free tier's 500 MB artifact storage — one all-platform run is roughly 400 MB.

name: Build Svelte App

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which platforms to build'
        type: choice
        default: 'all'
        options: ['all', 'linux', 'windows', 'macos']
      upload_artifacts:
        description: 'Attach the built apps to the run so they can be downloaded. They embed the CurseForge key — see ARTIFACTS in the workflow file.'
        type: boolean
        default: true
      run_e2e:
        description: 'Run the Playwright end-to-end suite (Linux only, adds a few minutes).'
        type: boolean
        default: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    # bash on every runner, so the shell steps below do not need a Windows variant.
    defaults:
      run:
        shell: bash

    strategy:
      # One platform failing should not cancel the others — usually the interesting result.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (AppImage)
            key: linux
            artifacts: |
              wowup-electron/release-svelte/*.AppImage
          # Pinned to match the upstream release workflow.
          - os: windows-2022
            label: Windows (NSIS + portable)
            key: windows
            artifacts: |
              wowup-electron/release-svelte/*.exe
          - os: macos-latest
            label: macOS (dmg + zip)
            key: macos
            artifacts: |
              wowup-electron/release-svelte/*.dmg
              wowup-electron/release-svelte/*.zip

    steps:
      - name: Skip platforms not requested
        id: gate
        run: |
          if [ "${{ inputs.platforms }}" = "all" ] || [ "${{ inputs.platforms }}" = "${{ matrix.key }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not requested — skipping ${{ matrix.label }}."
          fi

          # Artifact names may not contain a slash, and branch names here routinely do
          # (migrate/svelte5). Unsanitised, upload-artifact rejects the name outright — after
          # the ten-minute build has already run.
          echo "ref=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      # Fails immediately and says why, rather than building for ten minutes and producing an app
      # whose every CurseForge request 403s.
      - name: Check the secret is readable
        if: steps.gate.outputs.run == 'true'
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -z "${CURSEFORGE_API_KEY}" ]; then
            echo "::error::CURSEFORGE_API_KEY is empty."
            echo "Set it as a REPOSITORY secret: Settings → Secrets and variables → Actions →"
            echo "Repository secrets → New repository secret."
            echo "An *environment* secret will not work unless this job declares 'environment: <name>'."
            exit 1
          fi
          echo "Secret is present (${#CURSEFORGE_API_KEY} characters)."

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Use Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # wowup-electron depends on the local wowup-lib-core package, so the library is compiled
      # before the app installs.
      - name: Build wowup-lib
        if: steps.gate.outputs.run == 'true'
        run: |
          cd ./wowup-lib
          npm ci
          npm run build

      - name: Install app dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          cd ./wowup-electron
          npm ci

      # electron-builder needs this to produce a dmg. Upstream installs it the same way.
      - name: dmg-license
        if: steps.gate.outputs.run == 'true' && matrix.key == 'macos'
        run: |
          cd ./wowup-electron
          npm i dmg-license

      - name: Install renderer dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          cd ./wowup-electron/renderer-svelte
          npm ci

      # The renderer is platform-independent, so checking it once is enough.
      - name: Typecheck
        if: steps.gate.outputs.run == 'true' && matrix.key == 'linux'
        run: |
          cd ./wowup-electron/renderer-svelte
          npm run check

      - name: Lint
        if: steps.gate.outputs.run == 'true' && matrix.key == 'linux'
        run: |
          cd ./wowup-electron/renderer-svelte
          npm run lint

      - name: Unit tests
        if: steps.gate.outputs.run == 'true' && matrix.key == 'linux'
        run: |
          cd ./wowup-electron/renderer-svelte
          npx vitest run

      - name: Build app
        if: steps.gate.outputs.run == 'true'
        env:
          # Read by renderer-svelte/vite.config.ts. Passed as an env var rather than sourced from
          # a file: a key of the form "$2a$10$…" loses its $-segments to shell expansion if it is
          # ever `source`d, producing a silently invalid key and a 403 on every request.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          cd ./wowup-electron
          npm run svelte:package

      - name: Verify the key was baked into the bundle
        if: steps.gate.outputs.run == 'true'
        run: |
          cd ./wowup-electron
          npm run svelte:verify:key

      # Linux only: the runner has no display, so this needs xvfb. The Windows and macOS runners
      # would need a different harness, and the renderer is identical on all three anyway.
      - name: Verify the renderer boots
        if: steps.gate.outputs.run == 'true' && matrix.key == 'linux'
        run: |
          cd ./wowup-electron
          xvfb-run --auto-servernum node scripts/verify-boot.mjs

      - name: End-to-end tests
        if: steps.gate.outputs.run == 'true' && matrix.key == 'linux' && inputs.run_e2e
        run: |
          cd ./wowup-electron/renderer-svelte
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Summarise
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          cd ./wowup-electron
          {
            echo "### ${{ matrix.label }}"
            echo
            echo "\`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::8}\`"
            echo
            if ls release-svelte/* >/dev/null 2>&1; then
              echo '| file | size |'
              echo '|---|---:|'
              for f in release-svelte/*.AppImage release-svelte/*.exe release-svelte/*.dmg release-svelte/*.zip; do
                [ -f "$f" ] || continue
                echo "| \`$(basename "$f")\` | $(( $(stat -c%s "$f" 2>/dev/null || stat -f%z "$f") / 1048576 )) MB |"
              done
              echo
              if [ "${{ inputs.upload_artifacts }}" = "true" ]; then
                echo "Download from the **Artifacts** section of this run's summary:"
                echo "\`WowUp-CF-Svelte-${{ matrix.key }}-${{ steps.gate.outputs.ref }}.zip\` (kept 7 days)."
              else
                echo "Not uploaded — re-run with **Attach the built apps** ticked to download them."
              fi
            else
              echo 'No artifacts produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # compression-level 0 because every one of these is already a compressed container —
      # an AppImage, an NSIS installer, a dmg. Re-deflating ~130 MB gains almost nothing and
      # costs minutes of runner time on each of three platforms.
      #
      # Seven days rather than the 90-day default: the build embeds the CurseForge key, this
      # repository is public, and artifacts on a public repo are downloadable by anyone with
      # the run URL. Short retention narrows that window. See ARTIFACTS at the top.
      - name: Upload apps
        if: steps.gate.outputs.run == 'true' && inputs.upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WowUp-CF-Svelte-${{ matrix.key }}-${{ steps.gate.outputs.ref }}
          path: ${{ matrix.artifacts }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      # Screenshots and traces only — no key.
      - name: Upload test artifacts on failure
        if: failure() && matrix.key == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            wowup-electron/renderer-svelte/playwright-report
            wowup-electron/renderer-svelte/test-results
          retention-days: 7
